name: Build APK with p4a

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system and p4a dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev wget
          pip install --upgrade pip wheel setuptools cython==0.29.36 python-for-android

      - name: Setup Android SDK command-line tools
        run: |
          set -e
          export ANDROIDSDK="$HOME/android-sdk"
          mkdir -p "$ANDROIDSDK/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROIDSDK/cmdline-tools"
          mv "$ANDROIDSDK/cmdline-tools/cmdline-tools" "$ANDROIDSDK/cmdline-tools/latest"
          rm cmdline-tools.zip
          yes | head -n 100 | "$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROIDSDK" --licenses > /dev/null || true

      - name: Build APK directly with python-for-android
        run: |
          export ANDROIDSDK="$HOME/android-sdk"
          export ANDROIDNDK="$HOME/android-ndk"
          export PATH="$ANDROIDSDK/cmdline-tools/latest/bin:$ANDROIDSDK/platform-tools:$PATH"
          export ANDROIDAPI="33"
          export NDKAPI="21"
          mkdir -p "$ANDROIDNDK"
          yes | p4a apk \
            --private . \
            --package=az.guvende \
            --name="Guvende" \
            --version=0.1 \
            --bootstrap=sdl2 \
            --requirements=python3,kivy,requests,certifi,urllib3,idna,charset-normalizer \
            --arch=arm64-v8a \
            --sdk-dir="$ANDROIDSDK" \
            --ndk-dir="$ANDROIDNDK" \
            --permission=INTERNET \
            --permission=ACCESS_FINE_LOCATION \
            --permission=ACCESS_COARSE_LOCATION \
            --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guvende-apk
          path: "*.apk"
